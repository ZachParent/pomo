<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 1360 860" role="img" aria-labelledby="title desc">
  <title id="title">UI Story 03 - Instant room-theme sync</title>
  <desc id="desc">Host opens a full emoji picker; selected emoji and accent sync instantly to clients.</desc>

  <rect width="1360" height="860" fill="#f7f6f0"/>
  <text x="60" y="64" font-family="Arial, sans-serif" font-size="28" fill="#1f2a2e" font-weight="700">Story 03 - Instant sync with full emoji picker</text>

  <rect x="60" y="128" width="600" height="660" rx="16" fill="#ffffff" stroke="#d7ddd9"/>
  <text x="96" y="176" font-family="Arial, sans-serif" font-size="24" fill="#1f2a2e" font-weight="700">Host</text>
  <rect x="96" y="204" width="528" height="108" rx="12" fill="#f0f7ff" stroke="#2460c8"/>
  <text x="120" y="252" font-family="Arial, sans-serif" font-size="30" fill="#1f2a2e" font-weight="700">🧪 Deep Focus Board</text>

  <rect x="96" y="334" width="528" height="420" rx="12" fill="#ffffff" stroke="#d7ddd9"/>
  <text x="120" y="372" font-family="Arial, sans-serif" font-size="20" fill="#1f2a2e" font-weight="700">Emoji Picker</text>
  <rect x="120" y="390" width="480" height="46" rx="10" fill="#ffffff" stroke="#d7ddd9"/>
  <text x="144" y="420" font-family="Arial, sans-serif" font-size="18" fill="#516067">Search emoji</text>

  <rect x="120" y="452" width="480" height="282" rx="10" fill="#f4efe4" stroke="#d7ddd9"/>
  <text x="142" y="486" font-family="Arial, sans-serif" font-size="24">😀 😎 🤖 🚀 🎯 🧠 🧪 🌱 🍅 ☕ 🛠️ 🔔 ✨ 🎧 🧘 📚</text>
  <text x="142" y="522" font-family="Arial, sans-serif" font-size="24">🔥 🌊 🍀 🌞 🌙 🌈 ⚡ 🎵 💡 🧩 🧭 🕒 📝 📈 🧹 🪴</text>

  <rect x="520" y="452" width="80" height="64" rx="10" fill="#e6f0ff" stroke="#2460c8" stroke-width="2"/>
  <text x="548" y="493" font-family="Arial, sans-serif" font-size="32">🧪</text>

  <rect x="700" y="128" width="600" height="660" rx="16" fill="#ffffff" stroke="#d7ddd9"/>
  <text x="736" y="176" font-family="Arial, sans-serif" font-size="24" fill="#1f2a2e" font-weight="700">Client</text>
  <rect x="736" y="204" width="528" height="108" rx="12" fill="#f0f7ff" stroke="#2460c8"/>
  <text x="760" y="252" font-family="Arial, sans-serif" font-size="30" fill="#1f2a2e" font-weight="700">🧪 Deep Focus Board</text>

  <rect x="736" y="334" width="528" height="420" rx="12" fill="#ffffff" stroke="#d7ddd9"/>
  <text x="760" y="384" font-family="Arial, sans-serif" font-size="90" fill="#1f2a2e" font-weight="700">24:13</text>
  <rect x="760" y="420" width="460" height="16" rx="8" fill="#9ec0ef"/>
  <rect x="760" y="420" width="250" height="16" rx="8" fill="#2460c8"/>

  <line x1="658" y1="252" x2="694" y2="252" stroke="#2460c8" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2460c8"/>
    </marker>
  </defs>
</svg>
