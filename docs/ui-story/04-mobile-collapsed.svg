  <rect x="424" y="504" width="204" height="56" rx="12" fill="#ffffff" stroke="#d7ddd9"/>
  <text x="458" y="539" font-family="Arial, sans-serif" font-size="23" fill="#1f2a2e" font-weight="700">Set 23:30</text>

