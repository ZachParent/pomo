  <text x="92" y="406" font-family="Arial, sans-serif" font-size="122" fill="#1f2a2e" font-weight="700">24:13</text>

  <rect x="92" y="444" width="536" height="18" rx="9" fill="#b4dfe6"/>
  <rect x="92" y="444" width="300" height="18" rx="9" fill="#0d7c8f"/>

  <rect x="92" y="504" width="150" height="56" rx="12" fill="#0d7c8f"/>
  <text x="134" y="539" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">Pause</text>

  <rect x="258" y="504" width="150" height="56" rx="12" fill="#ffffff" stroke="#d7ddd9"/>
