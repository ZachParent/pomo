  <rect x="92" y="1080" width="536" height="86" rx="16" fill="#ffffff" stroke="#0d7c8f" stroke-width="3"/>
  <text x="294" y="1133" font-family="Arial, sans-serif" font-size="28" fill="#0d7c8f" font-weight="700">Settings</text>
