<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">UI Story 04 - Mobile collapsed</title>
  <desc id="desc">One-screen mobile timer with single settings action and minimal copy.</desc>

