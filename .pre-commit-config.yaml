repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: lint
        name: pnpm lint
        entry: pnpm lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: typecheck
        name: pnpm typecheck
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: unit-tests
        name: pnpm test:unit
        entry: pnpm test:unit
        language: system
        pass_filenames: false
        stages: [pre-push]
